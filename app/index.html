<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Code Flow Python</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="logo"><i></i>Code Flow</div>
  <nav class="tabs" id="tabs">
    <button data-v="browse" class="on">Questions</button>
    <button data-v="practice">Practice</button>
    <button data-v="sandbox">Sandbox</button>
  </nav>
  <button class="btn sm" id="btn-add">+ Add</button>
  <span class="pill" id="pill">Python loading…</span>
</header>
<main>
  <section id="v-browse">
    <div class="row" style="margin-bottom:10px">
      <div class="seg" id="groupby">
        <button data-g="section" class="on">Section</button>
        <button data-g="topic">Topic</button>
        <button data-g="pattern">Pattern</button>
        <button data-g="set">Question set</button>
      </div>
      <span class="mute small" id="summary"></span>
      <button class="btn sm" id="btn-export" style="margin-left:auto">Export my data</button>
    </div>
    <div class="filters">
      <input id="f-search" type="search" placeholder="Search title or text…">
      <select id="f-section"></select><select id="f-topic"></select><select id="f-pattern"></select>
      <select id="f-set"></select><select id="f-diff"></select><select id="f-status"></select>
    </div>
    <div id="groups"></div>
  </section>

  <section id="v-practice" class="hide">
    <div class="grid">
      <div>
        <div class="card" id="c-question"></div>
        <div class="card" id="c-input"></div>
        <div class="card" id="c-code"></div>
        <div class="card" id="c-extra"></div>
      </div>
      <div>
        <div class="card" id="c-flow"></div>
        <div class="card" id="c-output"></div>
        <div class="card hide" id="c-tests"></div>
        <div class="card hide" id="c-solution"></div>
      </div>
    </div>
  </section>
</main>
<div id="modal-root"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
